name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Clippy is informational for now — warnings are reported but don't fail the build.
    # NOTE: We intentionally do NOT pass --all-features because the optional
    # features `real-http2`, `real-webgl`, and `sandbox` depend on crates whose
    # APIs have drifted (h2::Body removed, glow API changed, seccomp pre_exec
    # Unix-only). Those features are WIP and not in the default feature set.
    # Clippy runs against the default features, which is what `cargo build` uses.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Run clippy (warnings reported, non-blocking)
        run: cargo clippy --all-targets -- -W warnings

  build:
    name: Build & Test (${{ matrix.os }} / Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Build
        run: cargo build --release --verbose
      - name: Run tests
        run: cargo test --release --verbose -- --test-threads=1
      - name: Upload binary
        if: matrix.rust == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: falco-${{ matrix.os }}
          path: |
            target/release/falco
            target/release/falco.exe
          if-no-files-found: ignore

  doc:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --no-deps --release
